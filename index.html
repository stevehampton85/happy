<script>
        // Adjusted points so a perfect score is exactly 100
        const questions = [
            {
                text: "Does this buy me time or steal it?",
                options: [
                    { label: "Buys me significant time", points: 10 },
                    { label: "Neutral or minor time saver", points: 5 },
                    { label: "Takes up time to learn, maintain, or store", points: -5 }
                ]
            },
            {
                text: "Is this a story, or just a thing?",
                options: [
                    { label: "A memorable experience or story", points: 10 },
                    { label: "A tool that actively enables an experience", points: 5 },
                    { label: "Just a physical object", points: 0 }
                ]
            },
            {
                text: "Does this bring me closer to people?",
                options: [
                    { label: "Yes, it will be shared directly with loved ones", points: 5 },
                    { label: "It opens up social opportunities", points: 3 },
                    { label: "No, it is strictly for solitary use", points: 0 }
                ]
            },
            {
                text: "Can I make it a treat rather than a standard?",
                options: [
                    { label: "Yes, this is a rare, high-value treat", points: 5 },
                    { label: "Somewhat, it will be an occasional indulgence", points: 3 },
                    { label: "No, I am trying to make this a new daily baseline", points: 0 }
                ]
            },
            {
                text: "Can I pay now and enjoy later?",
                options: [
                    { label: "Yes, paid upfront with time to anticipate it", points: 5 },
                    { label: "Immediate consumption upon purchase", points: 0 },
                    { label: "No, it involves financing or drawing out payments", points: -10 }
                ]
            },
            {
                text: "What are the associated costs to factor into total cost of ownership?",
                options: [
                    { label: "None / Negligible", points: 10 },
                    { label: "Minor upkeep, cheap accessories, or small subscriptions", points: 0 },
                    { label: "High ongoing maintenance, rapid depreciation, or premium subscriptions", points: -10 }
                ]
            },
            {
                text: "Does this eliminate an ongoing friction in your life?",
                options: [
                    { label: "Solves a daily or highly recurring headache", points: 15 },
                    { label: "Solves an occasional annoyance", points: 5 },
                    { label: "Doesn't solve any friction", points: 0 },
                    { label: "Actually introduces new friction or complexity", points: -5 }
                ]
            },
            {
                text: "How often will I actually use this?",
                options: [
                    { label: "Daily or weekly", points: 15 },
                    { label: "Monthly or seasonal", points: 5 },
                    { label: "Rarely, or just for a single event", points: 0 }
                ]
            },
            {
                text: "Does this align or conflict with my long-term future goals?",
                options: [
                    { label: "Directly supports major life goals or future plans", points: 15 },
                    { label: "Neutral", points: 0 },
                    { label: "Conflicts with goals by creating unnecessary financial drag", points: -15 }
                ]
            },
            {
                text: "Could I achieve this same feeling without buying something new?",
                options: [
                    { label: "No, this provides completely unique value", points: 10 },
                    { label: "Yes, but it would require significant effort or time", points: 5 },
                    { label: "Yes, I already own something similar or can replicate it for free", points: -10 }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let userScore = 0;

        const costInput = document.getElementById('cost');
        const taxCheckbox = document.getElementById('tax-checkbox');
        const costDisplay = document.getElementById('total-cost-display');
        const calculatedCost = document.getElementById('calculated-cost');

        function updateCost() {
            let base = parseFloat(costInput.value) || 0;
            if (base > 0) {
                costDisplay.style.display = 'block';
                let total = taxCheckbox.checked ? base * 1.13 : base;
                calculatedCost.textContent = total.toFixed(2);
            } else {
                costDisplay.style.display = 'none';
            }
        }

        costInput.addEventListener('input', updateCost);
        taxCheckbox.addEventListener('change', updateCost);

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startEvaluation() {
            showScreen('necessity-screen');
        }

        function handleNecessity(answer) {
            if (answer === 'yes') {
                showScreen('mandatory-screen');
            } else {
                currentQuestionIndex = 0;
                userScore = 0;
                loadQuestion();
                showScreen('question-screen');
            }
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question-title').innerText = `${currentQuestionIndex + 1}. ${q.text}`;
            
            const progress = (currentQuestionIndex / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Render radio buttons (removed unreliable inline onchange event)
            q.options.forEach((opt, index) => {
                const label = document.createElement('label');
                label.className = 'radio-option';
                label.innerHTML = `
                    <input type="radio" name="q-option" value="${opt.points}">
                    ${opt.label}
                `;
                optionsContainer.appendChild(label);
            });
        }

        function nextQuestion() {
            // Bulletproof method: Read directly from the DOM when Next is clicked
            const selectedOption = document.querySelector('input[name="q-option"]:checked');
            
            if (!selectedOption) {
                alert("Please select an answer to continue.");
                return;
            }

            userScore += parseInt(selectedOption.value, 10);
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('final-score').innerText = `${userScore}/100`;
            const titleEl = document.getElementById('recommendation-title');
            const textEl = document.getElementById('recommendation-text');

            if (userScore >= 75) {
                titleEl.innerText = "🟢 Green Light: Buy It";
                titleEl.style.color = "var(--success)";
                textEl.innerText = "This purchase offers a high emotional return with low operational friction. Make the purchase with confidence.";
            } else if (userScore >= 40) {
                titleEl.innerText = "🟡 Yellow Light: Pause";
                titleEl.style.color = "var(--warning)";
                textEl.innerText = "The value here is mixed. Enforce a 48-hour cooling-off period before deciding.";
            } else {
                titleEl.innerText = "🔴 Red Light: Stop";
                titleEl.style.color = "var(--danger)";
                textEl.innerText = "High probability of buyer's remorse or financial drag. Do not purchase. Invest the money elsewhere.";
            }

            showScreen('result-screen');
        }

        function resetApp() {
            document.getElementById('item-name').value = '';
            document.getElementById('cost').value = '';
            document.getElementById('tax-checkbox').checked = false;
            costDisplay.style.display = 'none';
            showScreen('start-screen');
        }

        // Modal Logic
        function openHelpModal() {
            document.getElementById('angel-reasons').value = '';
            document.getElementById('devil-reasons').value = '';
            document.getElementById('tally-result').style.display = 'none';
            document.getElementById('help-modal').style.display = 'flex';
        }

        function closeHelpModal() {
            document.getElementById('help-modal').style.display = 'none';
        }

        function countLines(textareaId) {
            const text = document.getElementById(textareaId).value;
            if (!text.trim()) return 0;
            return text.split('\n').filter(line => line.trim() !== '').length;
        }

        function tallyReasons() {
            const angelCount = countLines('angel-reasons');
            const devilCount = countLines('devil-reasons');
            const resultBox = document.getElementById('tally-result');
            
            let resultText = `You came up with <strong>${angelCount}</strong> reasons for Yes, and <strong>${devilCount}</strong> reasons for No. <br><br>`;

            if (angelCount > devilCount) {
                resultText += "You came up with more reasons to answer affirmatively. Look closely at your Devil's list—is there one clear, major reason that overrules everything else?";
            } else if (devilCount > angelCount) {
                resultText += "The drawbacks outnumber the benefits here. Unless there is an overwhelming reason on the Angel's side, this leans toward a negative choice.";
            } else if (angelCount === 0 && devilCount === 0) {
                resultText = "Please list some reasons in the boxes above to generate a tally.";
            } else {
                resultText += "It's a dead tie. Review both lists. Which side carries heavier long-term consequences?";
            }

            resultBox.innerHTML = resultText;
            resultBox.style.display = 'block';
        }
    </script>
